[package]
name = "solana-geyser-mock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solana-geyser-mock-yellowstone-grpc"
path = "src/main_yellowstone_grpc.rs"

[dependencies]
thiserror = "1.0"
anyhow = "1.0.62"
async-trait = "0.1.73"
base64 = "0.21.0"
bincode = "1.3.3"
bytes = "1.3.0"
cargo-lock = "9.0.0"
chrono = "0.4.26"
clap = { version = "4.3.0", features = ["derive"] }
const-hex = "1.6.2"
crossbeam-channel = "0.5.8"
env_logger = "0.10.0"
hex = "0.4.3"
hostname = "0.3.1"
http = "0.2.8"
hyper = "0.14.27"
json5 = "0.4.1"
lazy_static = "1.4.0"
log = "0.4.17"

tokio = "1.21.2"
tokio-stream = "0.1.11"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
futures = "0.3.24"

serde = "1.0.203" # must match the serde_derive version, see https://github.com/serde-rs/serde/issues/2584#issuecomment-1685252251
serde_bytes = "0.11.14"
serde_derive = "1.0.203" # must match the serde version, see https://github.com/serde-rs/serde/issues/2584#issuecomment-1685252251
serde_json = "1.0.117"
serde_with = { version = "2.3.3", default-features = false }


# Solana
## Solana SDK concepts
### version 4 (required for transaction v1 support: wincode 0.6 / message >= 4.5)
solana-account = { version = "4.5", features = ["bincode"] }
solana-hash = "4.6"
solana-message = { version = "4.5", default-features = false, features = ["serde"] }
solana-packet = { version = "4", default-features = false }
solana-pubkey = { version = "4.3", default-features = false }
solana-transaction = { version = "4.2", default-features = false, features = ["serde"] }
### version 3 (no version 4 published yet)
solana-bincode = "3" # no version 4 published yet
solana-clock = "3"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-epoch-schedule = "3"
solana-nonce = { version = "3", features = ["serde"] }
solana-keypair = { version = "3", default-features = false }
solana-quic-definitions = { version = "3", default-features = false }
solana-sanitize = "3"
solana-signature = { version = "3", default-features = false }
solana-system-interface = "2"
solana-time-utils = "3"
solana-transaction-error = { version = "3", default-features = false }
## Solana Validator related
## pinned to the 4.3.0 pre-release: it is the first Agave line on wincode 0.6 /
## solana-message 4.5, i.e. the first that is compatible with transaction v1.
solana-measure = "=4.3.0"
solana-metrics = { version = "=4.3.0" }
solana-net-utils = "=4.3.0"
solana-rpc-client = { version = "=4.3.0", default-features = false }
solana-rpc-client-api = { version = "=4.3.0" }
solana-rpc-client-types = { version = "=4.3.0", default-features = false }
solana-tls-utils = { version = "=4.3.0", default-features = false }
solana-transaction-status-client-types = "=4.3.0"
solana-transaction-status = "=4.3.0" # needed for RewardsAndNumPartitions; no ledger/rocksdb pull

agave-geyser-plugin-interface = "=4.3.0"

libloading = "0.7.4"
rand = "0.7.3"

yellowstone-grpc-geyser = { git = "https://github.com/rpcpool/yellowstone-grpc.git", tag = "v16.0.0+solana.4.3.0", default-features = false }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc.git", tag = "v16.0.0+solana.4.3.0", default-features = false }

[dev-dependencies]
lz4_flex = "0.11.3"

#agave-account-decoder = "=1.17.28"
#agave-geyser-plugin-interface = "=1.17.28"
#agave-logger = "=1.17.28"
#solana-sdk = "=1.17.28"
#agave-transaction-status = "=1.17.28"
